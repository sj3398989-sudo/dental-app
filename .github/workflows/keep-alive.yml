name: Keep-Alive (Supabase + Streamlit)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/evaluations?limit=1")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP Response Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Supabase keep-alive request successful"
          else
            echo "⚠ Supabase keep-alive request returned: $HTTP_CODE"
            exit 1
          fi

      - name: Setup Playwright
        run: |
          npm install -D playwright

      - name: Access Streamlit App with Playwright
        run: |
          npx playwright install chromium
          cat > /tmp/keep_alive.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();

          try {
            console.log('Accessing Streamlit app...');
            await page.goto('https://dental-app-zw5nqdbuealqwtgwemevqd.streamlit.app', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            // Wait for page to fully load
            await page.waitForTimeout(10000);

            // Check for sleep/wake button
            const wakeButton = await page.$('button:has-text("Yes, get this app back up!")');
            if (wakeButton) {
              console.log('App is sleeping. Clicking wake-up button...');
              await wakeButton.click();
              await page.waitForTimeout(5000);
            }

            console.log('✓ Streamlit app is active');
          } catch (error) {
            console.error('Error:', error.message);
            process.exit(1);
          } finally {
            await browser.close();
          }
          EOF

          node /tmp/keep_alive.mjs
